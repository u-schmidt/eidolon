<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Eidolon — Turn Detail{% endblock %}</title>
  <script src="{{ url_for('dashboard-static', path='htmx.min.js') }}"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
      --card: #f9fafb; --accent: #2563eb; --ok: #16a34a; --err: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14161a; --fg: #e5e7eb; --muted: #9ca3af; --border: #2a2d34; --card: #1c1f26; }
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--fg); margin: 0; padding: 1.5rem;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3 { font-weight: 600; margin: 0 0 0.5rem; }
    h1 { font-size: 1.25rem; }
    h2 { font-size: 1.05rem; margin-top: 1.5rem; }
    .muted { color: var(--muted); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 0.8rem; text-transform: uppercase; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.9rem 1rem; margin-bottom: 0.75rem;
    }
    .row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .field { margin-bottom: 0.4rem; }
    .field .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; margin-right: 0.4rem; }
    .badge {
      display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600;
    }
    .badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
    .badge.err { background: color-mix(in srgb, var(--err) 18%, transparent); color: var(--err); }
    .badge.neutral { background: var(--border); color: var(--muted); }
    pre {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem;
      overflow-x: auto; font-size: 0.8rem; margin: 0.4rem 0 0;
    }
    .banner {
      background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid var(--accent);
      border-radius: 6px; padding: 0.6rem 0.9rem; margin-bottom: 1rem; font-size: 0.85rem;
    }
    input[type=text], select {
      background: var(--card); color: var(--fg); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.35rem 0.6rem;
    }
    button {
      background: var(--accent); color: white; border: none; border-radius: 6px;
      padding: 0.35rem 0.8rem; cursor: pointer;
    }
    nav.top-nav {
      display: flex; gap: 1.25rem; align-items: baseline; margin-bottom: 1.25rem;
      padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);
    }
    nav.top-nav a.nav-link { color: var(--fg); font-weight: 500; }
    nav.top-nav a.nav-link:hover { color: var(--accent); }

    .detail-header {
      position: sticky; top: 0; z-index: 1;
      background: var(--bg); padding-top: 0.25rem; margin-bottom: 1rem;
    }
    .master-detail { display: flex; gap: 1rem; align-items: flex-start; }
    .step-list { flex: 0 0 320px; display: flex; flex-direction: column; gap: 0.4rem; }
    .step-list-item {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.5rem 0.7rem; color: var(--fg); font: inherit;
    }
    .step-list-item.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
    .step-detail-panel { flex: 1; min-width: 0; }
    .step-detail { display: none; }
    .step-detail.active { display: block; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <strong>Eidolon Dashboard</strong>
    <a class="nav-link" href="{{ url_for('dashboard_index') }}">Overview</a>
    <a class="nav-link" href="{{ url_for('dashboard_turns_list') }}">Turns</a>
    <a class="nav-link" href="{{ url_for('dashboard_performance') }}">Performance</a>
    <a class="nav-link" href="{{ url_for('dashboard_retrieval_quality') }}">Retrieval Quality</a>
    <a class="nav-link" href="{{ url_for('dashboard_prompt_quality') }}">Prompt Quality</a>
    <a class="nav-link" href="{{ url_for('dashboard_topic_lifecycle') }}">Topic Lifecycle</a>
    <a class="nav-link" href="{{ url_for('dashboard_cluster_dynamics') }}">Cluster Dynamics</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>

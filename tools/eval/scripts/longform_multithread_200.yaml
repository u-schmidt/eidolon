# A long (~200-turn) conversation simulating weeks of real chat history —
# stress-tests retrieval, clustering, and fact consolidation at a scale
# none of the other golden scripts reach (the next-largest is 16 turns).
#
# Sixteen recurring storylines (guitar lessons, a job search, an apartment
# repaint, marathon training, adopting a cat, ...) each resurface 4-9 times,
# spread across the whole script and separated by unrelated turns — same
# "topics never reopen once closed" design as bike_saga_clustering.yaml, so
# each recurrence is scripted as its own NEW_TOPIC and ClusterConsolidator
# has real work to do tying them back together. Interleaved with one-off
# small talk (weather, weekend plans, a broken umbrella, ...) in the same
# spirit as long_noisy_weak_topics.yaml, plus short CONTINUE follow-ups
# after roughly half of all topic openings, so the shape is closer to a
# real multi-week chat than a flat list of unrelated facts.
#
# topic_change is asserted (tier 1) on every turn — at this scale getting
# a handful wrong is expected and itself useful signal, not something to
# leave unasserted preemptively.
#
# expect_end.facts covers three genuinely durable, unambiguous updates
# (cat's name, marathon target race, new job) — kept deliberately small;
# most of what's revealed here is essence-level color, not profile
# material (matches FactConsolidator's own "bad profile facts" guidance).
#
# Runtime note: the shared eval_config.example.yaml sets
# facts.consolidation_interval: 2 for fast triggering on short scripts —
# against 200 turns that means ~100 consolidation passes, so this script
# takes meaningfully longer to run than the others.

name: "longform multithread — 200 turns, 16 recurring storylines"
peer_id: "eval-peer-longform-200"
language: "de"


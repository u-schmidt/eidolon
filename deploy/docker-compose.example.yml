# Example "server + pgvector" deployment preset for Eidolon.
#
# Bundles the core-as-a-service server (./server/Dockerfile) with a
# pgvector/pgvector:pg15 container in one compose file — mirroring
# Honcho's own pattern (API + its Postgres together in one stack),
# rather than requiring two separately-managed pieces. See
# ROADMAP.md's "Core-as-a-service deployment mode" entry for the
# "embedded + sqlite-vec" (try it in five minutes) vs. "server +
# pgvector" (running this for real) framing this implements.
#
# Usage (from the repo root):
#   cp eidolon.example.yaml deploy/eidolon.yaml   # then edit models: for your LLM/embedder
#   EIDOLON_DEPLOYMENT_TOKEN=... EIDOLON_STORAGE_PASSWORD=... \
#     docker compose -f deploy/docker-compose.example.yml up -d
#
# A caller (e.g. the Hermes adapter) then points its own eidolon.yaml at:
#   deployment:
#     mode: server
#     server_url: http://<this-host>:8420
#     token: ...   # must match EIDOLON_DEPLOYMENT_TOKEN below

services:
  eidolon-server:
    image: eidolon-server
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    ports:
      - "127.0.0.1:8420:8420"
    labels:
      # Picked up by the autoheal sidecar below — Docker Compose's own
      # `restart:` policy only reacts to the container *exiting*, never
      # to a healthcheck reporting "unhealthy" while the process stays
      # alive (a real incident: the process kept running and answering
      # HTTP fine while every real endpoint 500'd on a wedged DB
      # connection, for over a day, with nothing to notice or act on it).
      - "autoheal=true"
    healthcheck:
      # python, not curl/wget: the base image (python:3.12-slim) has
      # neither installed, and adding one just for this would be an
      # unnecessary extra package. Hits /readyz, not /healthz — /readyz
      # does a real (harmless, read-only) storage round-trip, so a
      # wedged DB connection pool actually fails this check instead of
      # /healthz's plain process-alive ping reporting healthy regardless.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8420/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - EIDOLON_DEPLOYMENT_TOKEN=${EIDOLON_DEPLOYMENT_TOKEN:?set a real token}
      - EIDOLON_STORAGE_PROVIDER=postgres
      - EIDOLON_STORAGE_HOST=eidolon-db
      - EIDOLON_STORAGE_PORT=5432
      - EIDOLON_STORAGE_DBNAME=eidolon
      - EIDOLON_STORAGE_USER=eidolon
      - EIDOLON_STORAGE_PASSWORD=${EIDOLON_STORAGE_PASSWORD:?set a real password}
    volumes:
      # Your own eidolon.yaml for LLM/embedder config (the `models:`
      # section) — storage is already fully configured via the env vars
      # above, so eidolon.yaml's `storage:` section is unused here.
      - ./eidolon.yaml:/app/eidolon.yaml:ro
    restart: unless-stopped
    depends_on:
      eidolon-db:
        condition: service_healthy

  # Watches containers labeled autoheal=true and `docker restart`s any
  # that Docker reports as "unhealthy" — plain Compose (not Swarm) never
  # does this on its own; `restart:` above only covers the container
  # actually exiting. Needs the Docker socket to issue that restart,
  # which is a real privilege grant (equivalent to host Docker control)
  # — the trade-off for this pattern; `:ro` on the mount doesn't
  # meaningfully restrict socket API calls, only replacing the socket
  # file itself. Each triggered restart is logged with a timestamp to
  # this container's own stdout — `docker logs autoheal` (or `docker
  # logs autoheal --since 48h`) is a durable log of every incident,
  # kept for as long as this container itself runs.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  eidolon-db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_DB=eidolon
      - POSTGRES_USER=eidolon
      - POSTGRES_PASSWORD=${EIDOLON_STORAGE_PASSWORD:?set a real password}
    volumes:
      # A host directory, never a Docker named volume — matches this
      # project's own storage-migration precedent (see ROADMAP.md's
      # Postgres/pgvector entry) of keeping data recoverable on the
      # host filesystem directly.
      - ./pgvector-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eidolon"]
      interval: 5s
      timeout: 5s
      retries: 5

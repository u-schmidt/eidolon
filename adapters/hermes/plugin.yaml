name: eidolon
description: "Eidolon — a topic memory system with associative retrieval and perspective attribution"
version: "0.1.0"
author: "Udo Schmidt"

# Memory provider plugin — replaces Honcho in Full Mode
memory_provider: eidolon

# Hooks for Topic-Only Mode (runs alongside Honcho)
hooks:
  - pre_llm_call

# Configuration
# Eidolon loads its configuration from ~/.eidolon/config.yaml
# See eidolon.example.yaml in the project root for all available options.
#
# Key settings to customize:
# - providers: define your LLM and embedder services (LM Studio, Ollama, etc.)
# - llm.provider: which provider to use for topic detection + extraction
# - embedder.provider: which provider to use for embeddings
# - storage.path: where to store the SQLite database

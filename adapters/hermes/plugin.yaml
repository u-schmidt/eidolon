name: eidolon
description: "Eidolon — a topic memory system with associative retrieval and perspective attribution"
version: "0.1.0"
author: "Udo Schmidt"

# Memory provider plugin — replaces Honcho in Full Mode
memory_provider: eidolon

# Hooks for Topic-Only Mode (runs alongside Honcho)
hooks:
  - pre_llm_call

# Configuration
# Eidolon loads its configuration from eidolon.yaml in the Hermes
# profile directory ($HERMES_HOME/eidolon.yaml). tools/install-plugin.sh
# scaffolds it from eidolon.example.yaml (project root), which documents
# all available options.
#
# Key settings to customize:
# - models.llm: LLM for topic detection + extraction (provider/base_url/model)
# - models.embedder: embedding model (provider/base_url/model/dimension)
# - storage: sqlite (path) or postgres (host/port/dbname/user/password)
# - deployment.mode: embedded (default) or server (talk to eidolon-server)

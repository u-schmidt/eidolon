# Eidolon Configuration
# =====================
#
# Copy this file to ~/.eidolon/config.yaml and adjust the values.
#
# Precedence (highest wins):
#   CLI args > Environment variables > YAML config > Code defaults
#
# Environment variables use the pattern: EIDOLON_<SECTION>_<KEY>
# Example: EIDOLON_LLM_PROVIDER=lm_studio

# ── Storage ────────────────────────────────────────────────
# Where and how Eidolon stores its data.
storage:
  provider: sqlite          # Only sqlite for V1
  path: ~/.eidolon/memory.db  # OS default: ~/.eidolon/memory.db (macOS/Linux)
                              #            %APPDATA%/eidolon/memory.db (Windows)

# ── Models ─────────────────────────────────────────────────
# Each entry is a complete, self-contained model endpoint — provider,
# connection, and model name together. No shared registry, no
# cross-references by name: if a role you actually use isn't fully
# specified here (provider + base_url + model), Eidolon refuses to start
# with a clear error rather than silently guessing an endpoint.
#
# "llm" and "embedder" are required. Add further roles (e.g. "judge" for
# a future trace-relevance-check model) the same way — no code changes
# needed, just a new block here.
# Provider options for llm/embedder:
#   openai_compatible  — any OpenAI-API endpoint: OpenAI, Groq, Together,
#                        OpenRouter, DeepInfra, vLLM, LiteLLM, a private
#                        gateway (set api_key for authenticated ones).
#   ollama | lm_studio — presets of openai_compatible with local defaults.
#   sentence_transformers — local PyTorch embeddings (embedder only).
#   simulated          — deterministic fake, no network (llm + embedder).
models:
  llm:
    provider: ollama            # openai_compatible | ollama | lm_studio | simulated
    base_url: http://192.168.1.100:11434
    model: deepseek-v4-flash:cloud
    max_tokens: 4096             # Response cap for all LLM calls (detection,
                                 # summarization, consolidation, chat). Give a
                                 # reasoning/"thinking" model generous headroom —
                                 # it bills hidden reasoning against this budget.
                                 # Fact extraction overrides this internally with
                                 # a larger cap (its JSON output grows with turn
                                 # richness).
    timeout: 60

  embedder:
    provider: lm_studio         # openai_compatible | ollama | lm_studio | sentence_transformers | simulated
    base_url: http://192.168.1.100:1234
    model: text-embedding-bge-m3
    dimension: 1024              # Vector dimension (bge-m3 = 1024, nomic-embed-text = 768)
    timeout: 30

  # Example: a hosted OpenAI-compatible endpoint (OpenAI, Groq, OpenRouter, ...).
  # Set api_key for authenticated endpoints — it's sent as a Bearer token.
  #   llm:
  #     provider: openai_compatible
  #     base_url: https://api.openai.com
  #     model: gpt-4o-mini
  #     api_key: sk-...            # or via EIDOLON_LLM_API_KEY

# Quick CLI overrides without touching this file — the two most-used
# roles have dedicated flags/env vars:
#   --llm-provider / --llm-base-url / --llm-model / --llm-max-tokens / --llm-timeout
#   --embedder-provider / --embedder-base-url / --embedder-model / --embedder-dimension / --embedder-timeout
#   EIDOLON_LLM_BASE_URL=... / EIDOLON_EMBEDDER_BASE_URL=... (etc., same pattern)
# Other roles (e.g. judge) are configured via this file only for now.

# ── Retrieval Weights + Result Counts ───────────────────────
# Weights: how much each dimension contributes to associative search
# scores. Values should sum to 1.0 for predictable behavior.
# Limits: how many related topics / memory items to inject per turn —
# "new" applies on a NEW_TOPIC turn (more context to catch up), "continue"
# applies on a CONTINUE turn. Summaries are short/dense, so a modest
# increase is cheap in tokens.
retrieval:
  semantic: 0.4              # Embedding vector similarity weight
  tag_overlap: 0.3           # Shared topic tags weight
  person: 0.2                # Same peer/speaker weight
  temporal: 0.1              # Temporal closeness weight
  related_topics_new: 6      # Related topics injected on a NEW_TOPIC turn
  related_topics_continue: 3 # Related topics injected on a CONTINUE turn
  memory_items_new: 4        # Memory items injected on a NEW_TOPIC turn
  memory_items_continue: 2   # Memory items injected on a CONTINUE turn
  recent_topics: 2           # Most-recently-closed topics injected regardless of relevance,
                              # excluding anything already surfaced above as a related topic

# ── Durable Facts Profile ───────────────────────────────────
# The small, curated profile (name, location, partner, work, ...) is
# reconciled in a periodic batch pass, not per-turn — see
# core/consolidation/fact_consolidator.py.
facts:
  consolidation_interval: 20  # Reconcile every N user turns
  target_max: 100             # Soft guidance to the LLM, not hard-enforced

# ── Debug Tracing ──────────────────────────────────────────
# Off by default — zero behavior/performance impact when disabled.
# When enabled, records per-step trace events (prompts, responses,
# retrieval score breakdowns, durations, failures) to a separate SQLite
# file. Inspect with: python tools/trace.py --db <trace_db_path>
debug:
  enabled: false
  trace_db_path: ~/.eidolon/trace.db

# ── General ───────────────────────────────────────────────
language: en                 # Language for stop word filtering (en | de)
                               # Note: LLM prompts are always in English
timezone: UTC                 # IANA zone name (e.g. Europe/Berlin) used to
                               # display the injected [Environment] time.
                               # Stored timestamps stay UTC regardless.

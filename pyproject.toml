[project]
name = "eidolon"
version = "0.1.0"
description = "A topic memory system — human-like memory for AI agents"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    # The storage-provider contract suite (tests/core/test_storage_provider_contract.py)
    # runs against a real Postgres via testcontainers, and tests/conftest.py
    # imports PostgresStore unconditionally — so these are dev-required,
    # not just the `postgres` extra's runtime-optional deps.
    "testcontainers[postgres]>=4",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
sentence-transformers = [
    "sentence-transformers>=3",
]
tui = [
    "textual>=0.60",
]
vec = [
    "sqlite-vec>=0.1.9",
]
postgres = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "tools*", "server*", "client*"]
exclude = ["data*", "tests*"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["data"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sorting, UP pyupgrade,
# B bugbear, C4 comprehensions, SIM simplifications.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length is enforced by the formatter's 120 cap, not the linter
]

[tool.ruff.lint.per-file-ignores]
# These deliberately run sys.path bootstrapping / import-availability
# guards before their module-level imports — E402 is expected there.
"adapters/hermes/__init__.py" = ["E402"]
"tools/cli.py" = ["E402"]
"tools/simulate_injection.py" = ["E402"]
"tools/trace_tui.py" = ["E402"]
"tools/run_eval.py" = ["E402"]
"tools/analyze_reports.py" = ["E402"]
"tools/migrate_sqlite_to_postgres.py" = ["E402"]
"tools/serve.py" = ["E402"]
# FastAPI's dependency-injection idiom requires Body(...)/Depends(...)
# as argument defaults — not the mutable-default-argument bug B008
# otherwise guards against.
"server/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["core", "adapters", "tools", "server"]
# Optional/runtime-resolved deps (Hermes' `agent.*`, textual,
# sentence_transformers) have no stubs and aren't importable here.
ignore_missing_imports = true
# Pragmatic baseline for an existing codebase — catches real type errors
# without demanding full annotation coverage on every local helper.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

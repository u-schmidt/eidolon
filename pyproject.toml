[project]
name = "eidolon"
version = "0.1.0"
description = "A topic memory system — human-like memory for AI agents"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
sentence-transformers = [
    "sentence-transformers>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "providers*", "adapters*", "tools*"]
exclude = ["data*", "tests*"]
